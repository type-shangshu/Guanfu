name: Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - ljw
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  NODE_VERSION: "20"
  # Pin ncnn (must include glslang submodule via recursive clone)
  NCNN_REF: b16501a65edf03828dae55b4d20ccc6a6bf4a3b4
  LIBWEBP_REF: v1.3.2
  VK_VERSION: "1.3.290.0"
  MODELS_BASE_URL: https://raw.githubusercontent.com/upscayl/upscayl/main/resources/models
  GH_TOKEN: ${{ github.token }}
  # Do not try to create GitHub releases during CI package steps
  EP_DRAFT: "true"
  CSC_IDENTITY_AUTO_DISCOVERY: "false"

defaults:
  run:
    shell: bash

jobs:
  # ---------------------------------------------------------------------------
  # Linux x64
  # ---------------------------------------------------------------------------
  linux-x64:
    runs-on: ubuntu-22.04
    env:
      RESTOREVAR_PARAM_URL: ${{ secrets.RESTOREVAR_PARAM_URL }}
      RESTOREVAR_BIN_URL: ${{ secrets.RESTOREVAR_BIN_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch backend deps (ncnn + libwebp)
        run: bash scripts/ci-fetch-backend-deps.sh

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/guanfu-desktop/package-lock.json

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake glslang-tools \
            libfuse2 libvulkan-dev zip rpm

      - name: Build backend (upscayl-bin)
        working-directory: backends/upscayl-ncnn
        run: |
          cmake -S src -B build-guanfu \
            -DCMAKE_BUILD_TYPE=Release \
            -DNCNN_VULKAN=ON \
            -DNCNN_VULKAN_ONLINE_SPIRV=ON \
            -DNCNN_ENABLE_LTO=OFF
          cmake --build build-guanfu --target upscayl-bin -j2

      - name: Stage backend binary
        run: |
          mkdir -p apps/guanfu-desktop/resources/linux-x64/bin
          cp backends/upscayl-ncnn/build-guanfu/upscayl-bin \
            apps/guanfu-desktop/resources/linux-x64/bin/upscayl-bin
          chmod 755 apps/guanfu-desktop/resources/linux-x64/bin/upscayl-bin

      - name: Stage models
        run: bash scripts/ci-stage-models.sh

      - name: Install desktop dependencies
        working-directory: apps/guanfu-desktop
        run: npm ci

      - name: Package desktop (linux x64)
        working-directory: apps/guanfu-desktop
        run: |
          npx tsc
          npm run build
          npx electron-builder --linux --x64 --publish never

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: guanfu-linux-x64
          if-no-files-found: error
          compression-level: 0
          path: |
            apps/guanfu-desktop/dist/*.AppImage
            apps/guanfu-desktop/dist/*.deb
            apps/guanfu-desktop/dist/*.rpm
            apps/guanfu-desktop/dist/*.zip

  # ---------------------------------------------------------------------------
  # Linux arm64
  # ---------------------------------------------------------------------------
  linux-arm64:
    runs-on: ubuntu-24.04-arm
    env:
      RESTOREVAR_PARAM_URL: ${{ secrets.RESTOREVAR_PARAM_URL }}
      RESTOREVAR_BIN_URL: ${{ secrets.RESTOREVAR_BIN_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch backend deps (ncnn + libwebp)
        run: bash scripts/ci-fetch-backend-deps.sh

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/guanfu-desktop/package-lock.json

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake glslang-tools \
            libfuse2 libvulkan-dev zip rpm

      - name: Build backend (upscayl-bin)
        working-directory: backends/upscayl-ncnn
        run: |
          cmake -S src -B build-guanfu \
            -DCMAKE_BUILD_TYPE=Release \
            -DNCNN_VULKAN=ON \
            -DNCNN_VULKAN_ONLINE_SPIRV=ON \
            -DNCNN_ENABLE_LTO=OFF
          cmake --build build-guanfu --target upscayl-bin -j2

      - name: Stage backend binary
        run: |
          mkdir -p apps/guanfu-desktop/resources/linux-arm64/bin
          cp backends/upscayl-ncnn/build-guanfu/upscayl-bin \
            apps/guanfu-desktop/resources/linux-arm64/bin/upscayl-bin
          chmod 755 apps/guanfu-desktop/resources/linux-arm64/bin/upscayl-bin

      - name: Stage models
        run: bash scripts/ci-stage-models.sh

      - name: Install desktop dependencies
        working-directory: apps/guanfu-desktop
        run: npm ci

      - name: Clean electron-builder cache
        run: rm -rf ~/.cache/electron-builder

      # deb/rpm need fpm (x86-only binary) — skip on arm64 runners
      - name: Package desktop (linux arm64)
        working-directory: apps/guanfu-desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          npx tsc
          npm run build
          npx electron-builder --linux AppImage zip --arm64 --publish never

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: guanfu-linux-arm64
          if-no-files-found: error
          compression-level: 0
          path: |
            apps/guanfu-desktop/dist/*.AppImage
            apps/guanfu-desktop/dist/*.zip

  # ---------------------------------------------------------------------------
  # Windows x64
  # ---------------------------------------------------------------------------
  windows-x64:
    runs-on: windows-latest
    env:
      RESTOREVAR_PARAM_URL: ${{ secrets.RESTOREVAR_PARAM_URL }}
      RESTOREVAR_BIN_URL: ${{ secrets.RESTOREVAR_BIN_URL }}
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch backend deps (ncnn + libwebp)
        shell: bash
        run: bash scripts/ci-fetch-backend-deps.sh

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/guanfu-desktop/package-lock.json

      - name: Install Vulkan SDK
        run: choco install vulkan-sdk -y --no-progress

      - name: Build backend (upscayl-bin.exe)
        working-directory: backends/upscayl-ncnn
        run: |
          $sdk = Get-ChildItem "C:\VulkanSDK" -Directory | Sort-Object Name -Descending | Select-Object -First 1
          if (-not $sdk) { throw "Vulkan SDK not found under C:\VulkanSDK" }
          $env:VULKAN_SDK = $sdk.FullName
          cmake -S src -B build-guanfu -A x64 `
            -DNCNN_VULKAN=ON `
            -DNCNN_VULKAN_ONLINE_SPIRV=ON `
            -DNCNN_ENABLE_LTO=OFF
          cmake --build build-guanfu --config Release --target upscayl-bin -j 2

      - name: Stage backend binary
        shell: bash
        run: |
          mkdir -p apps/guanfu-desktop/resources/win-x64/bin
          cp backends/upscayl-ncnn/build-guanfu/Release/upscayl-bin.exe \
            apps/guanfu-desktop/resources/win-x64/bin/upscayl-bin.exe
          vc="$(find "/c/Program Files/Microsoft Visual Studio" -name 'vcomp140.dll' 2>/dev/null | head -1 || true)"
          if [ -n "$vc" ]; then cp "$vc" apps/guanfu-desktop/resources/win-x64/bin/; fi

      - name: Stage models
        shell: bash
        run: bash scripts/ci-stage-models.sh

      - name: Install desktop dependencies
        working-directory: apps/guanfu-desktop
        run: npm ci

      - name: Package desktop (windows x64)
        working-directory: apps/guanfu-desktop
        run: |
          npx tsc
          npm run build
          npx electron-builder --win --x64 --publish never

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: guanfu-windows-x64
          if-no-files-found: error
          compression-level: 0
          path: |
            apps/guanfu-desktop/dist/*.exe
            apps/guanfu-desktop/dist/*.zip

  # ---------------------------------------------------------------------------
  # Windows arm64
  # ---------------------------------------------------------------------------
  windows-arm64:
    runs-on: windows-11-arm
    env:
      RESTOREVAR_PARAM_URL: ${{ secrets.RESTOREVAR_PARAM_URL }}
      RESTOREVAR_BIN_URL: ${{ secrets.RESTOREVAR_BIN_URL }}
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch backend deps (ncnn + libwebp)
        shell: bash
        run: bash scripts/ci-fetch-backend-deps.sh

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/guanfu-desktop/package-lock.json

      - name: Install Vulkan SDK
        run: choco install vulkan-sdk -y --no-progress

      - name: Build backend (upscayl-bin.exe)
        working-directory: backends/upscayl-ncnn
        run: |
          $sdk = Get-ChildItem "C:\VulkanSDK" -Directory | Sort-Object Name -Descending | Select-Object -First 1
          if (-not $sdk) { throw "Vulkan SDK not found under C:\VulkanSDK" }
          $env:VULKAN_SDK = $sdk.FullName
          cmake -S src -B build-guanfu -A ARM64 `
            -DNCNN_VULKAN=ON `
            -DNCNN_VULKAN_ONLINE_SPIRV=ON `
            -DNCNN_ENABLE_LTO=OFF
          cmake --build build-guanfu --config Release --target upscayl-bin -j 2

      - name: Stage backend binary
        shell: bash
        run: |
          mkdir -p apps/guanfu-desktop/resources/win-arm64/bin
          cp backends/upscayl-ncnn/build-guanfu/Release/upscayl-bin.exe \
            apps/guanfu-desktop/resources/win-arm64/bin/upscayl-bin.exe

      - name: Stage models
        shell: bash
        run: bash scripts/ci-stage-models.sh

      - name: Install desktop dependencies
        working-directory: apps/guanfu-desktop
        run: npm ci

      - name: Package desktop (windows arm64)
        working-directory: apps/guanfu-desktop
        run: |
          npx tsc
          npm run build
          npx electron-builder --win --arm64 --publish never

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: guanfu-windows-arm64
          if-no-files-found: error
          compression-level: 0
          path: |
            apps/guanfu-desktop/dist/*.exe
            apps/guanfu-desktop/dist/*.zip

  # ---------------------------------------------------------------------------
  # macOS arm64
  # ---------------------------------------------------------------------------
  macos-arm64:
    runs-on: macos-15
    env:
      RESTOREVAR_PARAM_URL: ${{ secrets.RESTOREVAR_PARAM_URL }}
      RESTOREVAR_BIN_URL: ${{ secrets.RESTOREVAR_BIN_URL }}
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch backend deps (ncnn + libwebp)
        run: bash scripts/ci-fetch-backend-deps.sh

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/guanfu-desktop/package-lock.json

      # Match upscayl-ncnn release.yml: brew provides glslangValidator + MoltenVK
      - name: Install backend dependencies
        run: |
          brew install --quiet libomp cmake glslang molten-vk vulkan-headers
          echo "LIBOMP_PREFIX=$(brew --prefix libomp)" >> "$GITHUB_ENV"
          echo "MOLTENVK_PREFIX=$(brew --prefix molten-vk)" >> "$GITHUB_ENV"
          echo "$(brew --prefix glslang)/bin" >> "$GITHUB_PATH"
          # Homebrew may ship glslangValidator and/or glslang
          GLSANG_BIN="$(command -v glslangValidator || true)"
          if [ -z "$GLSLANG_BIN" ]; then
            GLSANG_BIN="$(command -v glslang || true)"
          fi
          if [ -z "$GLSLANG_BIN" ]; then
            GLSANG_BIN="$(find "$(brew --prefix glslang)" -type f \( -name glslangValidator -o -name glslang \) | head -1)"
          fi
          echo "GLSLANG_BIN=$GLSLANG_BIN" >> "$GITHUB_ENV"
          test -x "$GLSLANG_BIN"
          "$GLSLANG_BIN" -v 2>&1 | head -5 || true

      - name: Build backend (upscayl-bin)
        working-directory: backends/upscayl-ncnn
        run: |
          LIBOMP="${LIBOMP_PREFIX}"
          MOLTENVK="${MOLTENVK_PREFIX}"
          MOLTENVK_LIB="$MOLTENVK/lib/libMoltenVK.dylib"
          if [ ! -f "$MOLTENVK_LIB" ]; then
            MOLTENVK_LIB="$(find "$MOLTENVK" -name 'libMoltenVK.dylib' | head -1)"
          fi
          GLSLANG="${GLSLANG_BIN}"
          cmake -S src -B build-guanfu \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DUSE_STATIC_MOLTENVK=OFF \
            -DNCNN_VULKAN=ON \
            -DNCNN_VULKAN_ONLINE_SPIRV=ON \
            -DNCNN_ENABLE_LTO=OFF \
            -DOpenMP_C_FLAGS="-Xclang -fopenmp -I${LIBOMP}/include" \
            -DOpenMP_CXX_FLAGS="-Xclang -fopenmp -I${LIBOMP}/include" \
            -DOpenMP_C_LIB_NAMES=omp \
            -DOpenMP_CXX_LIB_NAMES=omp \
            -DOpenMP_libomp_LIBRARY="${LIBOMP}/lib/libomp.a" \
            -DVulkan_INCLUDE_DIR="${MOLTENVK}/include" \
            -DVulkan_LIBRARY="${MOLTENVK_LIB}" \
            -DGLSLANGVALIDATOR_EXECUTABLE="${GLSLANG}"
          cmake --build build-guanfu --target upscayl-bin -j3

      - name: Stage backend binary
        run: |
          mkdir -p apps/guanfu-desktop/resources/mac-arm64/bin
          cp backends/upscayl-ncnn/build-guanfu/upscayl-bin \
            apps/guanfu-desktop/resources/mac-arm64/bin/upscayl-bin
          chmod 755 apps/guanfu-desktop/resources/mac-arm64/bin/upscayl-bin
          # dynamic MoltenVK next to binary (USE_STATIC_MOLTENVK=OFF)
          MOLTENVK_LIB="$(find "$(brew --prefix molten-vk)" -name 'libMoltenVK.dylib' | head -1)"
          if [ -n "$MOLTENVK_LIB" ]; then
            cp "$MOLTENVK_LIB" apps/guanfu-desktop/resources/mac-arm64/bin/libMoltenVK.dylib
            install_name_tool -add_rpath "@executable_path" \
              apps/guanfu-desktop/resources/mac-arm64/bin/upscayl-bin || true
          fi

      - name: Stage models
        run: bash scripts/ci-stage-models.sh

      - name: Install desktop dependencies
        working-directory: apps/guanfu-desktop
        run: npm ci

      - name: Package desktop (macOS arm64)
        working-directory: apps/guanfu-desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run dist:mac-arm64

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: guanfu-macos-arm64
          if-no-files-found: error
          compression-level: 0
          path: |
            apps/guanfu-desktop/dist/*.dmg
            apps/guanfu-desktop/dist/*.zip
